# Kanonische Nginx-Config für hoopsgermany.de (VPS 92.113.25.249).
# Ziel: /etc/nginx/sites-available/default  (danach: nginx -t && systemctl reload nginx)
#
# WICHTIG – zwei produktionskritische Dinge, die sonst leicht verloren gehen:
#  1) client_max_body_size 8M  → ohne das gilt der Nginx-Default 1 MB und Uploads
#     >1 MB (Handy-Fotos/Banner) werden mit 413 abgewiesen, bevor sie die App erreichen.
#  2) Die /players/ und /team/ Bild-Location  → Next.js (`next start`) liefert NUR
#     public/-Dateien aus, die ZUR BUILD-ZEIT existierten. Zur Laufzeit hochgeladene
#     Bilder (Profilfotos, Team-Logos/Banner) würden sonst 404 liefern. Diese Location
#     bedient sie direkt von der Platte. Die Extension-Regex trifft NUR Bilddateien,
#     daher kollidiert sie NICHT mit Next-Seiten wie /team/admin, /team/create usw.
#     (die fallen durch zu location / → Proxy auf die App).
#
#     Speicherort der Uploads: /var/www/hoops-uploads/{players,team}  (NICHT unter /root!
#     /root ist 700 → www-data kann nicht traversieren → "Permission denied"/404).
#     Die App schreibt weiterhin nach public/players bzw. public/team – das sind auf dem
#     VPS Symlinks auf /var/www/hoops-uploads/{players,team}:
#       ln -s /var/www/hoops-uploads/players /root/hoops-v2/public/players
#       ln -s /var/www/hoops-uploads/team    /root/hoops-v2/public/team
#       chown -R root:www-data /var/www/hoops-uploads && chmod -R a+rX /var/www/hoops-uploads

server {
    listen 80;
    server_name hoopsgermany.de www.hoopsgermany.de;
    client_max_body_size 8M;

    # Zur Laufzeit hochgeladene Bilder direkt von der Platte ausliefern (s. o.).
    location ~* ^/(players|team)/.+\.(jpg|jpeg|png|webp|gif)$ {
        root /var/www/hoops-uploads;
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    listen [::]:80;
    server_tokens off;
}

server {
    listen 443 ssl;
    server_name hoopsgermany.de www.hoopsgermany.de;
    client_max_body_size 8M;

    ssl_certificate /etc/letsencrypt/live/hoopsgermany.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hoopsgermany.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Zur Laufzeit hochgeladene Bilder direkt von der Platte ausliefern (s. o.).
    location ~* ^/(players|team)/.+\.(jpg|jpeg|png|webp|gif)$ {
        root /var/www/hoops-uploads;
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    listen [::]:443 ssl;
    server_tokens off;
}
